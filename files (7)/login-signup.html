<!doctype html>
<!--
  ============================================================================
  HOW THIS PAGE IS ACTUALLY SERVED (digi-line.eu — static file hosting, no
  per-request server rendering)
  ============================================================================
  The original design for this file assumed a backend that renders this HTML
  per-request and injects theme/language/redirects into #server-config. This
  site serves plain static .html files via nginx, so there is no per-request
  render step. Instead, a small script right before #server-config computes
  the same JSON client-side, from (in priority order):
    - URL query params: ?theme=dark, ?lang=de, ?redirect=<absolute-url>
    - OS-level preference: prefers-color-scheme, navigator.language
    - Fallback: light / en / https://dashboard.digi-line.eu/
  Everything below #server-config (the reading, the i18n dictionary, the
  animation, the redirect-button wiring) is unchanged in shape from the
  original design — only WHAT populates the tag changed, not how it's read.
  ============================================================================
-->
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta charset="utf-8">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e5e3db" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1d1f27" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,800;1,800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Sign In / Sign Up</title>
  <style>
    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root{
      --bg: #e5e3db;
      --panel: #f6f5f0;
      --text: #292929;
      --text-muted: #6b6f7a;
      --accent: #1657F0;
      --accent-bright: #36D7E0;
      --icon-color: #8992A5;
      --shadow-dark: rgba(189, 189, 189, .6);
      --shadow-light: rgba(255, 255, 255, .9);

      --cta-bg: #262933;
      --cta-text: #eef0f5;
      --cta-border: rgba(255, 255, 255, 0.15);
      --cta-border-hover: rgba(255, 255, 255, 0.45);
      --cta-shadow: 10px 10px 24px -4px rgba(0,0,0,.28), -6px -6px 16px -2px rgba(255,255,255,.85);
      --cta-shadow-hover: 14px 14px 28px -4px rgba(0,0,0,.35), -8px -8px 20px -2px rgba(255,255,255,.95);

      --ease-out:    cubic-bezier(.23, 1, .32, 1);
      --ease-in-out: cubic-bezier(.77, 0, .175, 1);
      --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

      --transition: 1.25s;
      --u: 6px;
    }

    :root[data-theme="dark"]{
      --bg: #1d1f27;
      --panel: #262933;
      --text: #eef0f5;
      --text-muted: #9aa0ad;
      --icon-color: #8992A5;
      --shadow-dark: rgba(0, 0, 0, .6);
      --shadow-light: rgba(255, 255, 255, .06);

      --cta-bg: #f6f5f0;
      --cta-text: #292929;
      --cta-border: rgba(0, 0, 0, 0.1);
      --cta-border-hover: rgba(0, 0, 0, 0.35);
      --cta-shadow: 10px 10px 24px -4px rgba(0,0,0,.65), -4px -4px 16px -2px rgba(255,255,255,.15);
      --cta-shadow-hover: 14px 14px 32px -4px rgba(0,0,0,.8), -6px -6px 20px -2px rgba(255,255,255,.25);
    }

    *, *::after, *::before{ margin: 0; padding: 0; box-sizing: border-box; }

    button, a, label{
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .main, .form__input, .button, .form__icon, .switch__button{
      corner-shape: squircle; /* progressive enhancement, ignored where unsupported */
    }

    body{
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', system-ui, Arial, sans-serif;
      font-size: 12px;
      background-color: var(--bg);
      color: var(--text-muted);
      transition: background .3s ease, color .3s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }

    /* ============================================================
       MAIN CARD
       ============================================================ */
    .main{
      position: relative;
      width: 1000px;
      min-width: 1000px;
      min-height: 600px;
      height: 600px;
      padding: 25px;
      background-color: var(--bg);
      box-shadow: 10px 10px 10px var(--shadow-dark), -10px -10px 10px var(--shadow-light);
      border-radius: 12px;
      overflow: hidden;
      transition: background .3s ease;
    }
    @media(max-width: 1200px){ .main{ transform: scale(.7); } }
    @media(max-width: 1000px){ .main{ transform: scale(.6); } }
    @media(max-width: 800px){ .main{ transform: scale(.5); } }
    @media(max-width: 600px){ .main{ transform: scale(.4); } }

    .container{
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      width: 600px;
      height: 100%;
      padding: 25px;
      background-color: var(--bg);
      transition: var(--transition), background .3s ease;
    }

    .form{
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .form__icons{ display: flex; }
    .form__icon{
      object-fit: contain;
      width: 30px;
      margin: 0 5px;
      opacity: .55;
      transition: .15s;
    }
    .form__icon:hover{ opacity: 1; cursor: pointer; }
    :root[data-theme="dark"] .form__icon{ filter: invert(1) brightness(1.6); }

    /* -- fields: kept from the Digi-Line pass -- */
    .form__input{
      width: 350px;
      height: 42px;
      margin: 5px 0;
      padding-left: 25px;
      font-size: 13px;
      letter-spacing: .15px;
      border: 1px solid transparent;
      outline: none;
      font-family: 'Plus Jakarta Sans', system-ui, Arial, sans-serif;
      color: var(--text);
      background-color: var(--panel);
      transition: box-shadow .25s var(--ease-out), border-color .2s var(--ease-out);
      border-radius: 8px;
      box-shadow:
        inset calc(var(--u)*.3) calc(var(--u)*.3) calc(var(--u)*.4) -1px var(--shadow-dark),
        inset calc(var(--u)*-.3) calc(var(--u)*-.3) calc(var(--u)*.4) -1px var(--shadow-light);
    }
    .form__input::placeholder{ color: var(--icon-color); }
    .form__input:focus{
      border-color: var(--accent);
      box-shadow:
        inset calc(var(--u)*.4) calc(var(--u)*.4) calc(var(--u)*.5) -1px var(--shadow-dark),
        inset calc(var(--u)*-.4) calc(var(--u)*-.4) calc(var(--u)*.5) -1px var(--shadow-light);
    }
    @media (max-width: 42rem){ .form__input{ font-size: 16px; } }

    .form__span{ margin-top: 28px; margin-bottom: 12px; color: var(--text-muted); }
    .form__link{
      color: var(--text);
      font-size: 14px;
      margin-top: 22px;
      border-bottom: 1px solid var(--icon-color);
      line-height: 2;
      text-decoration: none;
      transition: color .15s var(--ease-out), border-color .15s var(--ease-out);
      cursor: pointer;
    }
    .form__link:hover{ color: var(--accent); border-color: var(--accent); }

    .title{
      font-family: 'Barlow Condensed', system-ui, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.4;
      color: var(--text);
      letter-spacing: .5px;
    }

    .description{
      font-size: 14px;
      letter-spacing: .25px;
      text-align: center;
      line-height: 1.6;
    }

    /* -- buttons: kept from the Digi-Line pass (opposite-theme CTA recipe) -- */
    .button{
      width: 180px;
      height: 50px;
      border-radius: 25px;
      margin-top: 45px;
      font-family: 'Plus Jakarta Sans', system-ui, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.15px;
      background-color: var(--cta-bg);
      color: var(--cta-text);
      box-shadow: var(--cta-shadow);
      border: 1px solid var(--cta-border);
      outline: none;
      cursor: pointer;
      transition: box-shadow .25s var(--ease-out), border-color .2s var(--ease-out), transform .15s var(--ease-out), background .3s ease, color .3s ease;
    }
    .button:hover{ box-shadow: var(--cta-shadow-hover); border-color: var(--cta-border-hover); }
    .button:active{ transform: scale(.97); color: var(--accent); }

    /* ============================================================
       PANEL POSITIONS
       ============================================================ */
    .a-container{ z-index: 100; left: calc(100% - 600px); }
    .b-container{ left: calc(100% - 600px); z-index: 0; }

    /* -- switch panel: ORIGINAL recipe restored (solid neumorphic circle) -- */
    .switch{
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 400px;
      padding: 50px;
      z-index: 200;
      transition: var(--transition), background .3s ease;
      background-color: var(--panel);
      overflow: hidden;
      box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    }
    .switch__circle{
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background-color: var(--panel);
      box-shadow: inset 8px 8px 12px var(--shadow-dark), inset -8px -8px 12px var(--shadow-light);
      bottom: -60%;
      left: -60%;
      transition: var(--transition);
    }
    .switch__circle--t{
      top: -30%;
      left: 60%;
      width: 300px;
      height: 300px;
    }
    .switch__container{
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: absolute;
      width: 400px;
      padding: 50px 55px;
      transition: var(--transition);
    }
    .switch__title{ color: var(--text); }
    .switch__description{ color: var(--text-muted); }

    .switch__button{ cursor: pointer; }
    .switch__button:hover{ box-shadow: var(--cta-shadow-hover); transform: scale(.985); }
    .switch__button:active, .switch__button:focus{ transform: scale(.97); }

    /* ============================================================
       STATE CLASSES — the ORIGINAL animation logic (unchanged)
       ============================================================ */
    .is-txr{ left: calc(100% - 400px); transition: var(--transition); transform-origin: left; }
    .is-txl{ left: 0; transition: var(--transition); transform-origin: right; }
    .is-z200{ z-index: 200; transition: var(--transition); }
    .is-hidden{ visibility: hidden; opacity: 0; position: absolute; transition: var(--transition); }
    .is-gx{ animation: is-gx var(--transition); }
    @keyframes is-gx {
      0%, 10%, 100%{ width: 400px; }
      30%, 50%{ width: 500px; }
    }

    /* ============================================================
       ADDED: password visibility toggle, inline error banner
       (kept minimal and in the same visual language as the rest)
       ============================================================ */
    .form__password-wrap{ position: relative; width: 350px; margin: 5px 0; }
    .form__password-wrap .form__input{ width: 100%; margin: 0; padding-right: 42px; }
    .pw-toggle{
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .55;
      transition: opacity .15s;
    }
    .pw-toggle:hover{ opacity: 1; }
    .pw-toggle svg{ width: 18px; height: 18px; fill: var(--icon-color); }
    :root[data-theme="dark"] .pw-toggle svg{ fill: var(--text-muted); }

    .form__error{
      display: none;
      width: 350px;
      margin: 6px 0 0;
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #b3311c;
      background: rgba(179,49,28,.08);
      border: 1px solid rgba(179,49,28,.25);
      border-radius: 6px;
    }
    :root[data-theme="dark"] .form__error{ color: #ff8a75; background: rgba(255,138,117,.1); border-color: rgba(255,138,117,.3); }
    .form__error.show{ display: block; }

    .form__oauth{ display: flex; gap: 10px; margin-top: 4px; }
    .form__oauth a{ display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!--
    ==========================================================================
    SERVER-INJECTED CONFIG (now computed client-side — see comment at the top
    of this file for why)
    ==========================================================================
    Shape:
    {
      "theme":    "light" | "dark",
      "language": "en" | "de",
      "redirects": {
        "signIn":         "<absolute url>",   // where SIGN IN goes on success
        "signUp":          "<absolute url>",   // where SIGN UP goes on success
        "forgotPassword": "<url>"             // not implemented on the backend yet — see the link below
      }
    }
    - The panel "SIGN IN"/"SIGN UP" buttons inside .switch are NOT these
      redirect buttons — those just flip the card, exactly like the original.
      Only the form submit buttons and "Forgot your password?" use this.
  -->
  <script type="application/json" id="server-config">
  {
    "theme": "light",
    "language": "en",
    "redirects": {
      "signIn": "https://dashboard.digi-line.eu/",
      "signUp": "https://dashboard.digi-line.eu/",
      "forgotPassword": "#"
    }
  }
  </script>
  <script>
    (function computeServerConfig() {
      var params = new URLSearchParams(location.search);
      var prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = params.get('theme') === 'dark' || (!params.get('theme') && prefersDark) ? 'dark' : 'light';

      var browserLang = (navigator.language || 'en').toLowerCase();
      var language = params.get('lang') === 'de' || (!params.get('lang') && browserLang.indexOf('de') === 0) ? 'de' : 'en';

      // Only accept an absolute http(s) URL from the query string — anything
      // else falls back to the default app, so this can't be used to redirect
      // people to an arbitrary attacker-controlled destination after login.
      var redirectParam = params.get('redirect');
      var target = redirectParam && /^https:\/\/[a-z0-9.-]+\.digi-line\.eu\//i.test(redirectParam)
        ? redirectParam
        : 'https://dashboard.digi-line.eu/';

      var config = {
        theme: theme,
        language: language,
        redirects: { signIn: target, signUp: target, forgotPassword: '#' }
      };
      document.getElementById('server-config').textContent = JSON.stringify(config);
    })();
  </script>

  <div class="main">
    <div class="container a-container" id="a-container">
      <form id="a-form" class="form" method="" action="" novalidate>
        <h2 class="form_title title" data-i18n="title_signup">Create Account</h2>
        <!--
          Working OAuth options. Only Google, GitHub and Discord are here —
          those are the three providers that are free and activate instantly
          with no app-review wait. Facebook/LinkedIn require review before
          going live and Apple Sign In requires a paid ($99/yr) developer
          account, so per the "no money, no wait" constraint they're left out
          rather than shipped as buttons that don't actually work.
          Each is a real <a href> to /auth/<provider>/start, not a decorative
          image — clicking one leaves the page immediately.
        -->
        <div class="form__icons form__oauth">
          <a class="form__icon oauth-link" data-provider="google" href="/auth/google/start" title="Continue with Google" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="#000000" d="M12 10.9v2.55h4.24c-.17 1.19-.63 2.06-1.32 2.71-.82.77-2.09 1.63-4.32 1.63-3.5 0-6.24-2.82-6.24-6.29S6.9 5.21 10.4 5.21c1.89 0 3.27.74 4.29 1.7l1.86-1.81C15.06 3.7 13 2.75 10.4 2.75 5.6 2.75 1.5 6.72 1.5 11.5S5.6 20.25 10.4 20.25c3.02 0 5.23-.99 6.98-2.81 1.8-1.8 2.37-4.35 2.37-6.4 0-.63-.05-1.22-.15-1.71H12z"/></svg>
          </a>
          <a class="form__icon oauth-link" data-provider="github" href="/auth/github/start" title="Continue with GitHub" aria-label="Continue with GitHub">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="#000000" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          </a>
          <a class="form__icon oauth-link" data-provider="discord" href="/auth/discord/start" title="Continue with Discord" aria-label="Continue with Discord">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="#000000" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM9.5 15.2c-.83 0-1.5-.76-1.5-1.7s.67-1.7 1.5-1.7 1.5.76 1.5 1.7-.67 1.7-1.5 1.7zm5 0c-.83 0-1.5-.76-1.5-1.7s.67-1.7 1.5-1.7 1.5.76 1.5 1.7-.67 1.7-1.5 1.7zM8 9.3c1.1-1.1 2.5-1.7 4-1.7s2.9.6 4 1.7"/></svg>
          </a>
        </div>
        <span class="form__span" data-i18n="span_signup">or use email for registration</span>

        <div class="form__error" id="a-error" role="alert"></div>

        <input class="form__input" id="su-name" name="name" type="text" autocomplete="name" data-i18n-placeholder="ph_name" placeholder="Name">
        <input class="form__input" id="su-email" name="email" type="email" autocomplete="email" data-i18n-placeholder="ph_email" placeholder="Email">
        <div class="form__password-wrap">
          <input class="form__input" id="su-password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" data-i18n-placeholder="ph_password" placeholder="Password">
          <button type="button" class="pw-toggle" data-toggle-for="su-password" aria-label="Show password">
            <svg viewBox="0 0 24 24"><path d="M12 5c-5 0-9.27 3.11-11 7.5 1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
          </button>
        </div>

        <!--
          SIGN UP button — exact request body sent to POST /api/register:
            { "email": <email input>, "password": <password input>,
              "name": <name input, optional>,
              "language": <computed from CONFIG.language>,
              "theme": <computed from CONFIG.theme> }
          On success (200), immediately followed by POST /api/login with the
          same email+password (register does not itself start a session), then
          redirects to CONFIG.redirects.signUp on that second success.
        -->
        <button type="button" class="form__button button submit" id="su-submit" data-redirect="signUp" data-i18n="btn_signup">SIGN UP</button>
      </form>
    </div>

    <div class="container b-container" id="b-container">
      <form id="b-form" class="form" method="" action="" novalidate>
        <h2 class="form_title title" data-i18n="title_signin">Sign in to Website</h2>
        <div class="form__icons form__oauth">
          <a class="form__icon oauth-link" data-provider="google" href="/auth/google/start" title="Continue with Google" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="#000000" d="M12 10.9v2.55h4.24c-.17 1.19-.63 2.06-1.32 2.71-.82.77-2.09 1.63-4.32 1.63-3.5 0-6.24-2.82-6.24-6.29S6.9 5.21 10.4 5.21c1.89 0 3.27.74 4.29 1.7l1.86-1.81C15.06 3.7 13 2.75 10.4 2.75 5.6 2.75 1.5 6.72 1.5 11.5S5.6 20.25 10.4 20.25c3.02 0 5.23-.99 6.98-2.81 1.8-1.8 2.37-4.35 2.37-6.4 0-.63-.05-1.22-.15-1.71H12z"/></svg>
          </a>
          <a class="form__icon oauth-link" data-provider="github" href="/auth/github/start" title="Continue with GitHub" aria-label="Continue with GitHub">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="#000000" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          </a>
          <a class="form__icon oauth-link" data-provider="discord" href="/auth/discord/start" title="Continue with Discord" aria-label="Continue with Discord">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="#000000" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM9.5 15.2c-.83 0-1.5-.76-1.5-1.7s.67-1.7 1.5-1.7 1.5.76 1.5 1.7-.67 1.7-1.5 1.7zm5 0c-.83 0-1.5-.76-1.5-1.7s.67-1.7 1.5-1.7 1.5.76 1.5 1.7-.67 1.7-1.5 1.7zM8 9.3c1.1-1.1 2.5-1.7 4-1.7s2.9.6 4 1.7"/></svg>
          </a>
        </div>
        <span class="form__span" data-i18n="span_signin">or use your email account</span>

        <div class="form__error" id="b-error" role="alert"></div>

        <input class="form__input" id="si-email" name="email" type="email" autocomplete="email" data-i18n-placeholder="ph_email" placeholder="Email">
        <div class="form__password-wrap">
          <input class="form__input" id="si-password" name="password" type="password" autocomplete="current-password" data-i18n-placeholder="ph_password" placeholder="Password">
          <button type="button" class="pw-toggle" data-toggle-for="si-password" aria-label="Show password">
            <svg viewBox="0 0 24 24"><path d="M12 5c-5 0-9.27 3.11-11 7.5 1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
          </button>
        </div>
        <!--
          "Forgot your password?" — NOT wired to a backend yet. There is no
          password-reset endpoint on auth-service (would need reset-token
          generation + an email send via your Mailcow infra). Left as a
          disabled-looking link rather than faking a flow that doesn't work.
        -->
        <a href="#" class="form__link" id="forgot-link" data-i18n="forgot">Forgot your password?</a>

        <!--
          SIGN IN button — exact request body sent to POST /api/login:
            { "email": <email input>, "password": <password input> }
          On success (200), a session cookie is set by the server and the page
          redirects to CONFIG.redirects.signIn. No language/theme is sent here
          — those only change via POST /api/register or PUT /api/preferences.
        -->
        <button type="button" class="form__button button submit" id="si-submit" data-redirect="signIn" data-i18n="btn_signin">SIGN IN</button>
      </form>
    </div>

    <div class="switch" id="switch-cnt">
      <div class="switch__circle"></div>
      <div class="switch__circle switch__circle--t"></div>
      <div class="switch__container" id="switch-c1">
        <h2 class="switch__title title" data-i18n="switch_title_welcome">Welcome Back !</h2>
        <p class="switch__description description" data-i18n="switch_desc_welcome">To keep connected with us please login with your personal info</p>
        <button type="button" class="switch__button button switch-btn" data-i18n="switch_btn_signin">SIGN IN</button>
      </div>
      <div class="switch__container is-hidden" id="switch-c2">
        <h2 class="switch__title title" data-i18n="switch_title_hello">Hello Friend !</h2>
        <p class="switch__description description" data-i18n="switch_desc_hello">Enter your personal details and start journey with us</p>
        <button type="button" class="switch__button button switch-btn" data-i18n="switch_btn_signup">SIGN UP</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1) READ THE SERVER-INJECTED CONFIG (theme / language / redirects)
       ========================================================================== */
    var CONFIG = (function () {
      var DEFAULTS = {
        theme: "light",
        language: "en",
        redirects: { signIn: "#", signUp: "#", forgotPassword: "#" }
      };
      try {
        var raw = document.getElementById("server-config").textContent;
        var parsed = JSON.parse(raw);
        return {
          theme: parsed.theme === "dark" ? "dark" : "light",
          language: parsed.language || DEFAULTS.language,
          redirects: Object.assign({}, DEFAULTS.redirects, parsed.redirects || {})
        };
      } catch (e) {
        return DEFAULTS;
      }
    })();

    /* ==========================================================================
       2) i18n DICTIONARY — English + German only, per current requirement
       ========================================================================== */
    var I18N = {
      en: {
        title_signup: "Create Account",
        title_signin: "Sign in to Website",
        span_signup: "or use email for registration",
        span_signin: "or use your email account",
        ph_name: "Name",
        ph_email: "Email",
        ph_password: "Password",
        forgot: "Forgot your password?",
        btn_signup: "SIGN UP",
        btn_signin: "SIGN IN",
        switch_title_welcome: "Welcome Back !",
        switch_desc_welcome: "To keep connected with us please login with your personal info",
        switch_btn_signin: "SIGN IN",
        switch_title_hello: "Hello Friend !",
        switch_desc_hello: "Enter your personal details and start journey with us",
        switch_btn_signup: "SIGN UP",
        pw_show: "Show password",
        pw_hide: "Hide password",
        err_invalid_input: "Enter a valid email and a password of at least 10 characters.",
        err_invalid_credentials: "Wrong email or password.",
        err_no_password_set: "This account signs in with Google/GitHub/Discord — no password is set.",
        err_account_disabled: "This account has been disabled.",
        err_too_many_attempts: "Too many attempts. Try again shortly.",
        err_email_taken: "An account with that email already exists.",
        err_network: "Couldn't reach the server. Check your connection and try again.",
        err_oauth_failed: "That sign-in method didn't work. Try again or use email/password."
      },
      de: {
        title_signup: "Konto erstellen",
        title_signin: "Anmelden",
        span_signup: "oder mit Email registrieren",
        span_signin: "oder mit Email-Konto anmelden",
        ph_name: "Name",
        ph_email: "Email",
        ph_password: "Passwort",
        forgot: "Passwort vergessen?",
        btn_signup: "REGISTRIEREN",
        btn_signin: "ANMELDEN",
        switch_title_welcome: "Willkommen zurück!",
        switch_desc_welcome: "Bitte melde dich mit deinen Daten an, um verbunden zu bleiben",
        switch_btn_signin: "ANMELDEN",
        switch_title_hello: "Hallo Freund!",
        switch_desc_hello: "Gib deine Daten ein und starte mit uns durch",
        switch_btn_signup: "REGISTRIEREN",
        pw_show: "Passwort anzeigen",
        pw_hide: "Passwort verbergen",
        err_invalid_input: "Gib eine gültige Email und ein Passwort mit mindestens 10 Zeichen ein.",
        err_invalid_credentials: "Falsche Email oder falsches Passwort.",
        err_no_password_set: "Dieses Konto meldet sich über Google/GitHub/Discord an — es ist kein Passwort gesetzt.",
        err_account_disabled: "Dieses Konto wurde deaktiviert.",
        err_too_many_attempts: "Zu viele Versuche. Bitte in Kürze erneut versuchen.",
        err_email_taken: "Für diese Email existiert bereits ein Konto.",
        err_network: "Server nicht erreichbar. Verbindung prüfen und erneut versuchen.",
        err_oauth_failed: "Diese Anmeldemethode hat nicht funktioniert. Versuch es erneut oder nutze Email/Passwort."
      }
    };

    (function applyConfig() {
      document.documentElement.setAttribute("data-theme", CONFIG.theme);
      document.documentElement.setAttribute("lang", CONFIG.language);

      var dict = I18N[CONFIG.language] || I18N.en;

      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
        var key = el.getAttribute("data-i18n-placeholder");
        if (dict[key]) el.setAttribute("placeholder", dict[key]);
      });
      document.querySelectorAll(".pw-toggle").forEach(function (el) {
        el.setAttribute("aria-label", dict.pw_show);
      });
    })();

    /* ==========================================================================
       3) THE ORIGINAL SLIDING ANIMATION — untouched logic
       ========================================================================== */
    let switchCtn = document.querySelector("#switch-cnt");
    let switchC1 = document.querySelector("#switch-c1");
    let switchC2 = document.querySelector("#switch-c2");
    let switchCircle = document.querySelectorAll(".switch__circle");
    let switchBtn = document.querySelectorAll(".switch-btn");
    let aContainer = document.querySelector("#a-container");
    let bContainer = document.querySelector("#b-container");

    let changeForm = (e) => {
      switchCtn.classList.add("is-gx");
      setTimeout(function(){
        switchCtn.classList.remove("is-gx");
      }, 1500);
      switchCtn.classList.toggle("is-txr");
      switchCircle[0].classList.toggle("is-txr");
      switchCircle[1].classList.toggle("is-txr");
      switchC1.classList.toggle("is-hidden");
      switchC2.classList.toggle("is-hidden");
      aContainer.classList.toggle("is-txl");
      bContainer.classList.toggle("is-txl");
      bContainer.classList.toggle("is-z200");
    };

    for (var i = 0; i < switchBtn.length; i++) {
      switchBtn[i].addEventListener("click", changeForm);
    }

    // jump straight to the sign-up panel if linked with #signup (keeps old
    // links to a separate register.html working without a second file)
    if (window.location.hash === "#signup") { changeForm(); }

    /* ==========================================================================
       4) OAUTH LINKS — carry the validated redirect target through, so a
       provider login lands in the same place a password login would.
       ========================================================================== */
    document.querySelectorAll(".oauth-link").forEach(function (el) {
      var provider = el.getAttribute("data-provider");
      var target = CONFIG.redirects.signIn; // same destination either way
      el.href = "/auth/" + provider + "/start?redirect=" + encodeURIComponent(target);
    });

    /* ==========================================================================
       5) FORM SUBMISSION — this is the part the original file never actually
       did: it only navigated on click. These now really call the backend.
       ========================================================================== */
    function dict() { return I18N[CONFIG.language] || I18N.en; }

    function showFormError(boxEl, message) {
      boxEl.textContent = message;
      boxEl.classList.add("show");
    }
    function clearFormError(boxEl) {
      boxEl.classList.remove("show");
      boxEl.textContent = "";
    }
    function setSubmitLoading(btnEl, loading, loadingLabel, normalLabel) {
      btnEl.disabled = loading;
      btnEl.textContent = loading ? loadingLabel : normalLabel;
    }

    // password show/hide toggles
    document.querySelectorAll(".pw-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var input = document.getElementById(this.getAttribute("data-toggle-for"));
        var showing = input.type === "text";
        input.type = showing ? "password" : "text";
        this.setAttribute("aria-label", showing ? dict().pw_show : dict().pw_hide);
      });
    });

    // "Forgot your password?" — no backend yet, see comment near the link itself
    document.getElementById("forgot-link").addEventListener("click", function (e) {
      e.preventDefault();
    });

    // ---- SIGN IN ----
    var siForm = document.getElementById("b-form");
    var siError = document.getElementById("b-error");
    var siSubmit = document.getElementById("si-submit");
    siSubmit.addEventListener("click", function () {
      clearFormError(siError);
      var email = document.getElementById("si-email").value.trim();
      var password = document.getElementById("si-password").value;

      setSubmitLoading(siSubmit, true, "…", dict().btn_signin);
      fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (r) {
          if (r.ok) { window.location.href = CONFIG.redirects.signIn; return; }
          showFormError(siError, dict()["err_" + r.data.error] || dict().err_network);
          setSubmitLoading(siSubmit, false, "", dict().btn_signin);
        })
        .catch(function () {
          showFormError(siError, dict().err_network);
          setSubmitLoading(siSubmit, false, "", dict().btn_signin);
        });
    });

    // ---- SIGN UP ---- (register, then immediately log in — register alone
    // does not start a session, see comment above the button in the markup)
    var suError = document.getElementById("a-error");
    var suSubmit = document.getElementById("su-submit");
    suSubmit.addEventListener("click", function () {
      clearFormError(suError);
      var name = document.getElementById("su-name").value.trim();
      var email = document.getElementById("su-email").value.trim();
      var password = document.getElementById("su-password").value;

      if (password.length < 10 || password.length > 128) {
        showFormError(suError, dict().err_invalid_input);
        return;
      }

      setSubmitLoading(suSubmit, true, "…", dict().btn_signup);
      fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password, name: name, language: CONFIG.language, theme: CONFIG.theme })
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (r) {
          if (!r.ok) {
            showFormError(suError, dict()["err_" + r.data.error] || dict().err_network);
            setSubmitLoading(suSubmit, false, "", dict().btn_signup);
            return;
          }
          return fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, password: password })
          }).then(function (loginRes) {
            if (loginRes.ok) { window.location.href = CONFIG.redirects.signUp; return; }
            // account created but auto-login failed — send them to sign in manually
            window.location.href = "/login/";
          });
        })
        .catch(function () {
          showFormError(suError, dict().err_network);
          setSubmitLoading(suSubmit, false, "", dict().btn_signup);
        });
    });

    // Surface OAuth callback errors (?error=... from /auth/:provider/callback
    // redirecting back here) in whichever panel is showing.
    (function showOauthErrorIfAny() {
      var err = new URLSearchParams(location.search).get("error");
      if (!err) return;
      var box = bContainer.classList.contains("is-txl") ? suError : siError;
      showFormError(box, dict()["err_" + err] || dict().err_oauth_failed);
    })();
  </script>
</body>
</html>
