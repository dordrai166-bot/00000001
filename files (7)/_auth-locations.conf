# Shared internal locations for gated subdomains — included via
# `include /etc/nginx/conf.d/_auth-locations.conf;` inside a server{} block.
# Never reachable directly from the browser (marked internal).

location = /_auth_check {
    internal;
    proxy_pass http://auth-service:4000/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

# Same check, but also requires a specific purchased service (X-Required-Service).
# Point a location at this instead of /_auth_check when gating a section that
# needs more than just "logged in" — e.g. a specific paid product area.
location = /_auth_check_wa {
    internal;
    proxy_pass http://auth-service:4000/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Required-Service "wa-automation";
}

# Read-only "who am I / what are my prefs" — same-origin on every domain that
# includes this file, so client scripts never need a cross-origin fetch (and
# therefore never need CORS headers) just to read language/theme.
location = /api/session {
    proxy_pass http://auth-service:4000/verify;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location @login_redirect {
    return 302 https://digi-line.eu/login.html?redirect=$scheme://$host$request_uri;
}
location @no_access {
    return 302 https://digi-line.eu/upgrade.html;
}
