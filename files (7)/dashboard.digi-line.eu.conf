server {
    listen 80;
    listen [::]:80;
    server_name dashboard.digi-line.eu;
    location /.well-known/acme-challenge/ { root /web; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.digi-line.eu;
    ssl_certificate /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/dashboard-digi-line;
    index index.html;

    # Everything under this subdomain requires a valid session — no exceptions,
    # unlike the main domain which stays fully public.
    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;
        error_page 403 = @no_access;
    }

    include /etc/nginx/conf.d/_auth-locations.conf;
}
