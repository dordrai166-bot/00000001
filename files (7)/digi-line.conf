server {
    listen 80;
    listen [::]:80;
    server_name digi-line.eu www.digi-line.eu;
    location /.well-known/acme-challenge/ { root /web; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name digi-line.eu www.digi-line.eu;
    ssl_certificate /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/digi-line;
    index index.html;

    # Fully public — no auth_request anywhere on this domain. Gated content
    # lives on dashboard.digi-line.eu and app.digi-line.eu instead.

    location /api/login {
        proxy_pass http://auth-service:4000/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/register {
        proxy_pass http://auth-service:4000/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/logout {
        proxy_pass http://auth-service:4000/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Read-only "who am I" — lets any page (this domain or a gated subdomain)
    # check login state + language/theme prefs via one fetch, without needing
    # a second non-httpOnly cookie just to carry preferences around.
    location /api/session {
        proxy_pass http://auth-service:4000/verify;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/preferences {
        proxy_pass http://auth-service:4000/me/preferences;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OAuth start + callback for every configured provider. No path rewriting —
    # proxy_pass has no trailing path here on purpose, so auth-service sees the
    # exact same /auth/google/start, /auth/google/callback, etc.
    location /auth/ {
        proxy_pass http://auth-service:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
